; Умный браслет «антистресс» — Waveshare RP2040-Zero.
; SSD1306 0.91" (128x32) + MPU6500/MPU6050 + MAX30102 по I2C (GP0/GP1),
; вибромодуль на GP28, адресный светодиод (WS2812) на GP3.
;
;   pio run -t upload                 — прошивка браслета (env bracelet)
;   pio run -e hwtest -t upload       — тест железа (датчики, мотор, светодиоды)
;   pio run -e vibrotest -t upload    — тест только вибромотора
;   pio test -e native                — тесты логики на компьютере
;
; Первая заливка: зажать BOOT, подключить USB, отпустить — плата станет диском RPI-RP2.

[platformio]
default_envs = bracelet

[rp2040]
platform = https://github.com/maxgerhardt/platform-raspberrypi.git
board = waveshare_rp2040_zero
framework = arduino
board_build.core = earlephilhower
monitor_speed = 115200
; libc в тулчейне — newlib-nano: без этого printf("%f") печатает пустоту
build_flags = -Wl,-u,_printf_float

[env:bracelet]
extends = rp2040
build_src_filter = +<bracelet/>
lib_deps =
    adafruit/Adafruit SSD1306@^2.5.17
    adafruit/Adafruit GFX Library@^1.12.6
    adafruit/Adafruit NeoPixel@^1.15.5

[env:hwtest]
extends = rp2040
build_src_filter = +<hwtest/>
lib_deps =
    ${env:bracelet.lib_deps}
    sparkfun/SparkFun MAX3010x Pulse and Proximity Sensor Library@^1.1.2

[env:vibrotest]
extends = rp2040
build_src_filter = +<vibrotest/>
lib_deps = ${env:bracelet.lib_deps}

[env:native]
platform = native
test_framework = unity
build_flags = -std=c++17 -Wall -Wextra
